[package]
name        = "jux-authorx"
description = "Author-X: text editor with native column selection for the JUX desktop"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

# O binário não leva o prefixo `jux-`: na crates.io a crate é "jux-authorx",
# no terminal o comando é "authorx".
[[bin]]
name = "authorx"
path = "src/main.rs"

[dependencies]
