[package]
name        = "jux-orbit"
description = "JUX desktop shell: compositor, panel, dock, workspaces and window management"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

# O binário não leva o prefixo `jux-`: na crates.io a crate é "jux-orbit",
# no terminal o comando é "orbit".
[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
