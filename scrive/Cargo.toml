[package]
name        = "jux-scrive"
description = "Scrive: PDF reader for the JUX desktop"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

# O binário não leva o prefixo `jux-`: na crates.io a crate é "jux-scrive",
# no terminal o comando é "scrive".
[[bin]]
name = "scrive"
path = "src/main.rs"

[dependencies]
