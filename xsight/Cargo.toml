[package]
name        = "jux-xsight"
description = "xSight: image viewer for the JUX desktop"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

# O binário não leva o prefixo `jux-`: na crates.io a crate é "jux-xsight",
# no terminal o comando é "xsight".
[[bin]]
name = "xsight"
path = "src/main.rs"

